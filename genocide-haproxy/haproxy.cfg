defaults
   timeout connect 5s
   timeout client 1m
   timeout server 1m

frontend stats
   bind *:9091
   mode http
   stats uri /
   stats show-legends
   no log

frontend http_front
   bind *:8080
   default_backend http_back

backend http_back
    balance roundrobin
    option httpchk
    http-check send meth GET uri /genocide/ping
    server genocide-1 10.5.0.7:8080 check
    server genocide-2 10.5.0.8:8080 check
