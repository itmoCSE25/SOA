defaults
   timeout connect 5s
   timeout client 1m
   timeout server 1m
   timeout check 1m

frontend stats
   bind *:9091
   mode http
   stats uri /
   stats show-legends
   no log

frontend http_front
   bind *:8080
   default_backend http_back

backend http_back
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/ping
    server genocide-1 10.5.0.9:8081 check
    server genocide-2 10.5.0.10:8081 check
