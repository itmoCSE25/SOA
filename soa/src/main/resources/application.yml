spring:
  application:
    name: soa
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        instance-id: ${CONTAINER_NAME}
        service-name: soa
        health-check-path: /ping
        health-check-interval: 10s
        hostname: ${CONTAINER_HOST}
        port: 8080
        scheme: https
        health-check-tls-skip-verify: true
  ssl:
    bundle:
      jks:
        server:
          key:
            alias: soa
          keystore:
            location: "classpath:ssl/server.keystore"
            password: changeit
            type: PKCS12
      pem:
        client:
          truststore:
            certificate: "classpath:ssl/client.cer"



datasource:
  url: jdbc:postgresql://main-db:5432/postgres
  username: postgres
  password: postgres
server:
  port: 8080
  ssl:
    key-alias: soa-service
    key-password: changeit
    key-store: "classpath:ssl/server.keystore"
    key-store-password: changeit
    client-auth: WANT