defaults
   timeout connect 5s
   timeout client 1m
   timeout server 1m

frontend stats
   bind *:9091
   mode http
   stats uri /
   stats show-legends
   no log

frontend http_front
   bind *:8080
   default_backend http_back

backend http_back
    balance roundrobin
    server-template mywebapp 1-10 _soa._tcp.service.consul resolvers consul check

resolvers consul
    nameserver consul consul:8600
    accepted_payload_size 8192
    hold valid 5s
